steps:
  # 1. Build using google-22 builder. Runtime version and entrypoint are
  #    auto-detected from .python-version and project.toml at the repo
  #    root. Apt packages are NOT auto-detected from a file — Google's
  #    buildpacks only read them from the GOOGLE_APT_PACKAGES env var
  #    below (apt.txt is a Heroku convention, not a Google one).
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'
      - '--builder=gcr.io/buildpacks/builder:google-22'
      - '--publish'
      - '--env=GOOGLE_APT_PACKAGES=libglib2.0-0 libgl1 libgl1-mesa-glx libgthread-2.0-0 libsm6 libxext6 libxrender1 libxcb1 libx11-xcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 libgomp1'

  # 2. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'assistant-backend'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # A ~1GB quantized model plus llama.cpp + OCR overhead needs real
      # headroom — Cloud Run's 512Mi default will OOM-kill the container.
      - '--memory=4Gi'
      - '--cpu=2'
      # Model download + first inference can take a while; generous request
      # timeout so the first real chat request doesn't get cut off.
      - '--timeout=600'
      # Keeps one instance warm so the model stays loaded in memory instead
      # of re-downloading (~1GB) and reloading on every cold start. This
      # does mean the instance is billed continuously — drop this flag if
      # you'd rather eat occasional cold-start latency to save cost for
      # personal/low-traffic use.
      - '--min-instances=1'
      - '--max-instances=2'

options:
  logging: CLOUD_LOGGING_ONLY