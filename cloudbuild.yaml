steps:
  # 1. Build the image from the Dockerfile — explicit, deterministic
  #    control over the runtime environment instead of relying on
  #    buildpack auto-detection for compiled ML dependencies.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'
      - '.'

  # 2. Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'assistant-backend'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # A ~1GB quantized model plus llama.cpp + OCR overhead needs real
      # headroom — Cloud Run's 512Mi default will OOM-kill the container.
      - '--memory=4Gi'
      - '--cpu=2'
      # Model download + first inference can take a while; generous request
      # timeout so the first real chat request doesn't get cut off.
      - '--timeout=600'
      # Keeps one instance warm so the model stays loaded in memory instead
      # of re-downloading (~1GB) and reloading on every cold start. This
      # does mean the instance is billed continuously — drop this flag if
      # you'd rather eat occasional cold-start latency to save cost for
      # personal/low-traffic use.
      - '--min-instances=1'
      - '--max-instances=2'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/assistant-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
