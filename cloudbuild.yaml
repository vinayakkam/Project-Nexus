steps:
  # 1. Build using google-22 builder and pass APT packages as an environment variable
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/olit-backend:$COMMIT_SHA'
      - '--builder=gcr.io/buildpacks/builder:google-22'
      - '--publish'
      - '--env=GOOGLE_RUNTIME_VERSION=3.11.*'
      - '--env=GOOGLE_ENTRYPOINT=gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 4 --timeout 300 app:app'
      - '--env=GOOGLE_APT_PACKAGES=libglib2.0-0 libgl1 libgl1-mesa-glx libgthread-2.0-0 libsm6 libxext6 libxrender1 libxcb1 libx11-xcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0'

  # 2. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'olit-backend'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/olit-backend:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # OCR model load happens on first request (lazy-loaded in app.py) so
      # give Cloud Run enough request timeout to absorb a slow first call.
      - '--timeout=300'
      # Give the container more CPU during startup so imports (onnxruntime,
      # opencv) finish faster and the health check doesn't time out.
      - '--cpu-boost'
      # Keep at least one instance warm so users don't repeatedly eat the
      # first-request OCR init cost. Remove if cost is a bigger concern
      # than cold-start latency.
      - '--min-instances=1'

options:
  logging: CLOUD_LOGGING_ONLY